<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Bingo 🎯</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── SETUP SCREEN ── -->
  <div id="setup-screen" class="screen active">
    <div class="setup-card">
      <div class="cs2-logo">🎯</div>
      <h1>CS2 <span class="accent">BINGO</span></h1>
      <p class="subtitle">2 найзын тоглоом — хэн нь түрүүлж 5 хийх вэ?</p>

      <div class="form-group">
        <label>Өрөөний нэр (Room ID)</label>
        <div class="input-row">
          <input id="room-input" type="text" placeholder="cs2bingo-найзууд" maxlength="20" />
          <button id="random-room-btn" class="icon-btn" title="Random ID">🎲</button>
        </div>
      </div>

      <div class="form-group">
        <label>Таны нэр</label>
        <input id="name-input" type="text" placeholder="CT_Cote" maxlength="16" />
      </div>

      <button id="join-btn" class="btn-primary">Нэгдэх / Үүсгэх</button>

      <div id="setup-error" class="error-msg hidden"></div>
    </div>
  </div>

  <!-- ── LOBBY SCREEN ── -->
  <div id="lobby-screen" class="screen hidden">
    <div class="lobby-card">
      <h2>Өрөө: <span id="lobby-room-id"></span></h2>
      <p class="share-hint">Энэ линкийг найздаа илгээ 👇</p>
      <div class="share-box">
        <span id="share-url"></span>
        <button id="copy-btn" class="icon-btn">📋</button>
      </div>
      <div class="players-list">
        <div class="player-slot" id="p1-slot">
          <div class="player-avatar">🧑</div>
          <span id="p1-name">Хүлээж байна…</span>
        </div>
        <div class="vs-label">VS</div>
        <div class="player-slot" id="p2-slot">
          <div class="player-avatar">👤</div>
          <span id="p2-name">Хүлээж байна…</span>
        </div>
      </div>
      <div id="lobby-status" class="status-msg">2 тоглогч хүлээж байна…</div>
      <button id="start-btn" class="btn-primary hidden">Тоглоом эхлүүлэх 🚀</button>
    </div>
  </div>

  <!-- ── GAME SCREEN ── -->
  <div id="game-screen" class="screen hidden">
    <!-- Header -->
    <header class="game-header">
      <div class="header-info">
        <span class="room-label">🏠 <span id="game-room-id"></span></span>
        <span class="round-label">Round <span id="round-num">1</span></span>
      </div>
      <div class="score-bar">
        <div class="score-item" id="score-me">
          <span class="score-name" id="score-name-me">—</span>
          <span class="score-num" id="score-val-me">0</span>
        </div>
        <div class="score-divider">:</div>
        <div class="score-item" id="score-opp">
          <span class="score-name" id="score-name-opp">—</span>
          <span class="score-num" id="score-val-opp">0</span>
        </div>
      </div>
    </header>

    <!-- Grids -->
    <div class="grids-wrapper">
      <!-- My grid -->
      <div class="grid-section" id="my-section">
        <h3 class="grid-title my-title">🎯 <span id="my-grid-label">Миний</span></h3>
        <div class="bingo-grid" id="my-grid"></div>
        <div class="bingo-lines" id="my-lines-display"></div>
      </div>

      <!-- Opponent grid (read-only) -->
      <div class="grid-section" id="opp-section">
        <h3 class="grid-title opp-title">👁 <span id="opp-grid-label">Найз</span></h3>
        <div class="bingo-grid readonly" id="opp-grid"></div>
        <div class="bingo-lines" id="opp-lines-display"></div>
      </div>
    </div>

    <!-- Status bar -->
    <div id="game-status-bar" class="game-status-bar">Тоглоом эхэлж байна…</div>
  </div>

  <!-- ── WIN MODAL ── -->
  <div id="win-modal" class="modal hidden">
    <div class="modal-card">
      <div class="win-emoji" id="win-emoji">🏆</div>
      <h2 id="win-title">BINGO!</h2>
      <p id="win-msg"></p>
      <div class="countdown-bar">
        <div class="countdown-fill" id="countdown-fill"></div>
      </div>
      <p class="countdown-text">Дараагийн round <span id="countdown-num">5</span>с-д эхэлнэ…</p>
      <button id="next-round-btn" class="btn-primary">Одоо эхлүүлэх ⚡</button>
    </div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
